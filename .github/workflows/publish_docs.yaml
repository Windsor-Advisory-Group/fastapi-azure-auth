name: Publish docs 📄

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/publish_docs.yaml"

permissions: {}

jobs:
  build:
    # Installs and runs third-party npm code, so it gets no write token and no persisted git credentials.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6 # v6
        with:
          node-version: "22.2"
      - name: Build
        run: |
          cd docs
          npm ci --ignore-scripts
          npm run build
      - uses: actions/upload-pages-artifact@v4 # v4
        with:
          path: ./docs/build

  deploy:
    # Runs no repository code or npm packages; its token can only deploy to GitHub Pages.
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
